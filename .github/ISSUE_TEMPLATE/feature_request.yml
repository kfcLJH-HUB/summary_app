name: 功能建议
description: 提出改进建议和真实使用场景
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: 请先搜索已有建议；请勿附私人聊天记录或密钥。
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到什么问题？
      description: 请描述使用场景，而不仅是希望添加的按钮或功能。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望如何改善？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或补充信息
