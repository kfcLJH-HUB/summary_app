name: Build Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'package*.json'
      - 'build/**'
      - 'core/**'
      - 'electron/**'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'index.html'
      - '*config*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Package Windows x64
        run: npm run package:win
      - name: Verify application and installer artifacts
        shell: pwsh
        run: |
          if (!(Test-Path 'release/win-unpacked/AI Session Summary.exe')) {
            throw 'Windows application executable missing'
          }
          if (!(Get-ChildItem release -Filter '*-win-x64-setup.exe')) {
            throw 'NSIS installer missing'
          }
          if (!(Get-ChildItem release -Filter '*-win-x64.zip')) {
            throw 'Windows ZIP missing'
          }
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ai-session-summary-windows-x64
          path: |
            release/*-win-x64-setup.exe
            release/*-win-x64.zip
          if-no-files-found: error
          retention-days: 14
